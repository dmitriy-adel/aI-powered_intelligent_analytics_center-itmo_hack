services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: itmo_hack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    ports:
      - "5432:5432"
    volumes:
      - itmo_hack_pgdata:/var/lib/postgresql/data
      - ./src/sql_scripts/create_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/sql_scripts/seed_sources.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  itmo_hack_pgdata:
