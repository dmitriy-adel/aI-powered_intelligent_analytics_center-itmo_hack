<svg viewBox="100 100 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B4C8C"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A63A8"/>
      <stop offset="100%" stop-color="#2B4C8C"/>
    </linearGradient>
    <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A63A8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3A63A8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="docClip">
      <rect x="-14" y="-19" width="32" height="38" rx="2"/>
    </clipPath>

    <style>
      .eye-right {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: wink 4.5s ease-in-out infinite;
      }
      @keyframes wink {
        0%, 86%, 100% { transform: scaleY(1); }
        90%, 93%      { transform: scaleY(0.08); }
      }

      .doc-scroll {
        animation: scrollLines 3.5s linear infinite;
      }
      @keyframes scrollLines {
        from { transform: translateY(0); }
        to   { transform: translateY(-44px); }
      }
    </style>
  </defs>

  <!-- фон -->

  <g transform="translate(0,60)">
    <!-- мягкое свечение на "полу" -->
    <ellipse cx="200" cy="440" rx="130" ry="20" fill="url(#floorGlow)"/>

    <!-- антенна + сигнал -->
    <line x1="200" y1="55" x2="200" y2="15" stroke="#3A63A8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="15" r="9" fill="#A78BFA"/>
    <circle cx="200" cy="15" r="26" fill="url(#signalGlow)"/>
    <path d="M 178 30 A 32 32 0 0 1 222 30" stroke="#A78BFA" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 168 40 A 46 46 0 0 1 232 40" stroke="#A78BFA" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- тело -->
    <rect x="120" y="220" width="160" height="150" rx="45" fill="url(#bodyGrad)"/>

    <!-- панель на груди -->
    <rect x="160" y="260" width="80" height="60" rx="14" fill="#0F1626"/>
    <circle cx="180" cy="290" r="7" fill="#4FD1C5"/>
    <circle cx="200" cy="290" r="7" fill="#A78BFA"/>
    <circle cx="220" cy="290" r="7" fill="#4FD1C5"/>
    <rect x="172" y="302" width="56" height="6" rx="3" fill="#2B4C8C"/>

    <!-- левая рука (держит лупу) -->
    <path d="M 130 250 Q 90 260 78 305" stroke="url(#bodyGrad)" stroke-width="26" fill="none" stroke-linecap="round"/>
    <g transform="translate(50,300) rotate(-20)">
      <circle cx="0" cy="0" r="26" fill="#EAF4FF" stroke="#1B3A6B" stroke-width="8"/>
      <line x1="18" y1="18" x2="42" y2="42" stroke="#1B3A6B" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- правая рука (держит планшет со "скроллящимся" текстом) -->
    <path d="M 270 250 Q 310 260 320 300" stroke="url(#bodyGrad)" stroke-width="26" fill="none" stroke-linecap="round"/>
    <g transform="translate(322,300)">
      <rect x="-20" y="-26" width="42" height="54" rx="4" fill="#EAF4FF" stroke="#1B3A6B" stroke-width="4"/>
      <g clip-path="url(#docClip)">
        <g class="doc-scroll">
          <!-- блок строк №1 -->
          <line x1="-11" y1="-16" x2="13" y2="-16" stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="-5"  x2="9"  y2="-5"  stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="6"   x2="13" y2="6"   stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="17"  x2="4"  y2="17"  stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <!-- тот же блок №2, сдвинут ровно на период анимации (44) — обеспечивает бесшовный цикл -->
          <line x1="-11" y1="28" x2="13" y2="28" stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="39" x2="9"  y2="39" stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="50" x2="13" y2="50" stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
          <line x1="-11" y1="61" x2="4"  y2="61" stroke="#9DB6DE" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ноги -->
    <rect x="145" y="360" width="30" height="34" rx="12" fill="#0F1626"/>
    <rect x="225" y="360" width="30" height="34" rx="12" fill="#0F1626"/>

    <!-- голова -->
    <circle cx="200" cy="140" r="90" fill="url(#headGrad)"/>

    <!-- ушки-антенны сбоку -->
    <circle cx="112" cy="140" r="12" fill="#3A63A8"/>
    <circle cx="288" cy="140" r="12" fill="#3A63A8"/>

    <!-- экран-лицо -->
    <rect x="140" y="105" width="120" height="80" rx="30" fill="#EAF4FF"/>

    <!-- левый глаз (обычный) -->
    <circle cx="175" cy="145" r="13" fill="#1B3A6B"/>
    <circle cx="179" cy="141" r="4" fill="#FFFFFF"/>

    <!-- правый глаз (подмигивает) -->
    <g class="eye-right">
      <circle cx="225" cy="145" r="13" fill="#1B3A6B"/>
      <circle cx="229" cy="141" r="4" fill="#FFFFFF"/>
    </g>

    <!-- улыбка -->
    <path d="M 178 165 Q 200 180 222 165" stroke="#1B3A6B" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- румянец -->
    <circle cx="150" cy="160" r="9" fill="#FF9E9E" opacity="0.5"/>
    <circle cx="250" cy="160" r="9" fill="#FF9E9E" opacity="0.5"/>
  </g>
</svg>
