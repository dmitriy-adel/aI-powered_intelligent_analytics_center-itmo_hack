{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитический центр</title>
  <link rel="stylesheet" href="{% static 'newsroom/css/styles.css' %}">
</head>
<body>
  {% csrf_token %}
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 12V7M6 12V4M10 12V9M14 12V2" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <span class="sidebar__brand-name">Аналитический центр</span>
      </div>

      <div class="sidebar__scroll" id="sidebar-scroll">
        <!-- sidebar nav rendered by app.js -->
        <div class="skeleton" style="height:32px;"></div>
        <div class="skeleton" style="height:32px;"></div>
        <div class="skeleton" style="height:32px;"></div>
      </div>

      <div class="sidebar__footer">
        <button class="btn btn--secondary btn--block" id="btn-refresh-sources" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12.25 7A5.25 5.25 0 1 1 10.6 3.15M12.25 1.75V4.9H9.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Обновить источники
        </button>
        <button class="btn btn--secondary btn--block" id="btn-open-sources" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 8.75A1.75 1.75 0 1 0 7 5.25a1.75 1.75 0 0 0 0 3.5Z" stroke="currentColor" stroke-width="1.3"/><path d="M11.4 8.6l.9.9-1 1-1-.6a3.5 3.5 0 0 1-.9.5l-.2 1.1H7.2l-.2-1.1a3.5 3.5 0 0 1-.9-.5l-1 .6-1-1 .6-1a3.5 3.5 0 0 1-.5-.9l-1.1-.2V5.9l1.1-.2c.1-.3.3-.6.5-.9l-.6-1 1-1 1 .6c.3-.2.6-.4.9-.5l.2-1.1h1.6l.2 1.1c.3.1.6.3.9.5l1-.6 1 1-.6 1c.2.3.4.6.5.9l1.1.2v1.6l-1.1.2c-.1.3-.3.6-.5.9Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          Источники
        </button>
        <button class="btn btn--primary btn--block" id="btn-add-news" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2.9v8.2M2.9 7h8.2" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
          Добавить публикацию
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="skeleton" style="height:60px;"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack"></div>

  <script src="{% static 'newsroom/js/config.js' %}"></script>
  <script src="{% static 'newsroom/js/api.js' %}"></script>
  <script src="{% static 'newsroom/js/app.js' %}"></script>
</body>
</html>
